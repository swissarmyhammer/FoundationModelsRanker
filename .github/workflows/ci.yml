name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      # The real-model suite is a nested package. This input makes the unit
      # job build it on every run and makes the integration job run it.
      integration-package-path: IntegrationTests
      # The build compiles MLX through FoundationModelsExtras. No input names
      # the MLX metallib, because no test loads a real MLX model: the unit
      # tests give `ModelPool` a stub loader, and the integration tests use
      # the on-device system model.
