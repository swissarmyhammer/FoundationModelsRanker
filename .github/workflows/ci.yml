name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      # The real-model suite is a nested package. This input makes the unit
      # job build it on every run and makes the integration job run it.
      integration-package-path: IntegrationTests
      # The build compiles MLX through FoundationModelsExtras, and one
      # integration suite loads a real MLX model (`mlx-community/Qwen3-4B-4bit`
      # through `PooledModel`). This input makes the shared workflow copy the
      # `default.metallib` that SwiftPM puts in the Cmlx bundle beside each
      # `.xctest` bundle of the nested package before the run. The unit tests
      # give `ModelPool` a stub loader and need no metallib.
      integration-metallib-glob: "*Cmlx*/default.metallib"
